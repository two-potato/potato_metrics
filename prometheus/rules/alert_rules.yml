groups:
  - name: system.rules
    rules:
      - alert: InstanceDown
        expr: up == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Instance {{ $labels.instance }} down"
          description: "{{ $labels.instance }} is unreachable for more than 2 minutes."

      - alert: HighCPU
        expr: avg by (instance) (rate(node_cpu_seconds_total{mode!='idle'}[5m])) > 0.85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High CPU usage on {{ $labels.instance }}"
          description: "CPU usage > 85% for 5m on {{ $labels.instance }}."

      - alert: PostgresConnectionsHigh
        expr: pg_stat_activity_count > 100
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High number of Postgres connections"
          description: "More than 100 connections for 5m."
